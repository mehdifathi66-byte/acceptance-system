<script>
// شمارنده فیش - هوشمند
let receiptCounter = 1000;
let currentEditingReceipt = null;
let currentReceiptNumber = null;
let selectedSoftware = [];

// توابع جدید برای مدیریت داده از طریق URL
function saveToURL(history) {
    const data = {
        receiptCounter: receiptCounter,
        acceptanceHistory: history
    };
    const compressed = btoa(JSON.stringify(data)); // encode به base64
    const url = new URL(window.location);
    url.searchParams.set('data', compressed);
    window.history.replaceState({}, '', url);
}

function loadFromURL() {
    const urlParams = new URLSearchParams(window.location.search);
    const dataParam = urlParams.get('data');
    
    if (dataParam) {
        try {
            const data = JSON.parse(atob(dataParam)); // decode از base64
            return data;
        } catch (e) {
            console.error('Error loading from URL:', e);
        }
    }
    return null;
}

// توابع اصلی با پشتیبانی از URL
function loadHistory() {
    // اول از URL چک کن
    const urlData = loadFromURL();
    if (urlData) {
        receiptCounter = urlData.receiptCounter;
        return urlData.acceptanceHistory;
    }
    
    // اگر URL نداشت، از localStorage بردار
    return JSON.parse(localStorage.getItem('acceptanceHistory') || '[]');
}

function saveHistory(history) {
    // هم به URL اضافه کن هم به localStorage
    saveToURL(history);
    localStorage.setItem('acceptanceHistory', JSON.stringify(history));
}

function getReceiptCounter() {
    const history = loadHistory();
    if (history.length === 0) return 1000;
    
    const maxReceipt = history.reduce((max, item) => {
        const receiptNum = parseInt(item.receiptNumber.split('-')[1]);
        return receiptNum > max ? receiptNum : max;
    }, 1000);
    
    return maxReceipt;
}

// مقداردهی اولیه شمارنده
receiptCounter = getReceiptCounter();

document.addEventListener('DOMContentLoaded', function() {
  const deviceType = document.getElementById('deviceType');
  const consoleTypeSection = document.getElementById('consoleTypeSection');
  const controllerSection = document.getElementById('controllerSection');
  const softwareSection = document.getElementById('softwareSection');
  const problemRow = document.getElementById('problemRow');
  const savePrintBtn = document.getElementById('savePrintBtn');
  const editReceiptBtn = document.getElementById('editReceiptBtn');
  const deleteReceiptBtn = document.getElementById('deleteReceiptBtn');
  const historyList = document.getElementById('historyList');
  const printable = document.getElementById('printable');
  const generateInvoice = document.getElementById('generateInvoice');
  const invoiceTotal = document.getElementById('invoiceTotal');
  const customerHistory = document.getElementById('customerHistory');
  const phoneHistory = document.getElementById('phoneHistory');
  const customService1 = document.getElementById('customService1');
  const customService2 = document.getElementById('customService2');
  const customService1Count = document.getElementById('customService1Count');
  const customService2Count = document.getElementById('customService2Count');
  
  function updateCustomerHistory() {
    const history = loadHistory();
    const customers = [...new Set(history.map(item => item.name))];
    const phones = [...new Set(history.map(item => item.phone))];
    
    customerHistory.innerHTML = customers.map(name => `<option value="${name}">`).join('');
    phoneHistory.innerHTML = phones.map(phone => `<option value="${phone}">`).join('');
  }
  
  function renderHistory() {
    const history = loadHistory();
    if (history.length === 0) {
      historyList.innerHTML = '<div style="text-align:center; padding:10px; color:#666;">هیچ پذیرشی ثبت نشده</div>';
      return;
    }
    
    const last20 = history.slice(-20).reverse();
    historyList.innerHTML = last20.map(item => `
      <div class="history-item" onclick="loadReceiptForEdit('${item.receiptNumber}')">
        <button class="delete-history" onclick="event.stopPropagation(); deleteReceipt('${item.receiptNumber}')">×</button>
        <strong>${item.receiptNumber}</strong> - ${item.name} - ${item.device} - ${item.date.split(' ')[0]}
      </div>
    `).join('');
  }
  
  function updateDeviceView() {
    const isController = deviceType.value === 'controller';
    const isComputer = deviceType.value === 'laptop' || deviceType.value === 'pc';
    const isConsole = deviceType.value === 'console';
    
    consoleTypeSection.style.display = isController ? 'block' : 'none';
    controllerSection.style.display = isController ? 'block' : 'none';
    softwareSection.style.display = isComputer ? 'block' : 'none';
    problemRow.style.display = isController ? 'none' : 'table-row';
    
    if (isController) {
      updateConsoleButtons();
    }
  }
  
  function updateConsoleButtons() {
    const consoleType = document.querySelector('input[name="consoleType"]:checked').value;
    document.getElementById('psButtons').style.display = consoleType === 'ps' ? 'flex' : 'none';
    document.getElementById('xboxButtons').style.display = consoleType === 'xbox' ? 'flex' : 'none';
  }
  
  function calculateInvoiceTotal() {
    let total = 0;
    selectedSoftware = [];
    
    document.querySelectorAll('#softwareSection input[type="checkbox"]:checked').forEach(checkbox => {
      if (!checkbox.id.includes('customService')) {
        const price = parseInt(checkbox.dataset.price) || 0;
        total += price;
        selectedSoftware.push(checkbox.value);
      }
    });
    
    if (customService1.checked) {
      const count = parseInt(customService1Count.value) || 1;
      const price = parseInt(customService1.dataset.price) || 0;
      total += price * count;
    }
    
    if (customService2.checked) {
      const count = parseInt(customService2Count.value) || 1;
      const price = parseInt(customService2.dataset.price) || 0;
      total += price * count;
    }
    
    invoiceTotal.textContent = `جمع فاکتور: ${total.toLocaleString()} تومان`;
    invoiceTotal.style.display = generateInvoice.checked ? 'block' : 'none';
    return total;
  }
  
  customService1.addEventListener('change', function() {
    customService1Count.disabled = !this.checked;
    calculateInvoiceTotal();
  });
  
  customService2.addEventListener('change', function() {
    customService2Count.disabled = !this.checked;
    calculateInvoiceTotal();
  });
  
  customService1Count.addEventListener('change', calculateInvoiceTotal);
  customService2Count.addEventListener('change', calculateInvoiceTotal);
  
  deviceType.addEventListener('change', updateDeviceView);
  document.querySelectorAll('input[name="consoleType"]').forEach(radio => {
    radio.addEventListener('change', updateConsoleButtons);
  });
  document.querySelectorAll('#softwareSection input[type="checkbox"]').forEach(checkbox => {
    if (!checkbox.id.includes('customService')) {
      checkbox.addEventListener('change', calculateInvoiceTotal);
    }
  });
  
  generateInvoice.addEventListener('change', calculateInvoiceTotal);
  
  document.getElementById('customerName').addEventListener('input', function() {
    const history = loadHistory();
    const customer = history.find(item => item.name === this.value);
    if (customer) {
      document.getElementById('customerPhone').value = customer.phone;
    }
  });
  
  function calculateDeliveryDate(days) {
    const today = new Date();
    const deliveryDate = new Date(today);
    deliveryDate.setDate(today.getDate() + parseInt(days));
    return deliveryDate.toLocaleDateString('fa-IR');
  }
  
  function findExistingReceipt(name, phone) {
    const history = loadHistory();
    return history.find(item => item.name === name && item.phone === phone);
  }
  
  savePrintBtn.addEventListener('click', function() {
    const name = document.getElementById('customerName').value.trim();
    const phone = document.getElementById('customerPhone').value.trim();
    const device = deviceType.options[deviceType.selectedIndex].text;
    const deposit = document.getElementById('deposit').value.trim() || '0';
    const deliveryDays = document.getElementById('deliveryDays').value || '1';
    const deliveryDate = calculateDeliveryDate(deliveryDays);
    const shouldGenerateInvoice = generateInvoice.checked;
    const invoiceAmount = calculateInvoiceTotal();
    
    let problem = '';
    let consoleType = '';
    
    if (deviceType.value === 'controller') {
      consoleType = document.querySelector('input[name="consoleType"]:checked').value;
      const buttonSection = consoleType === 'ps' ? 'psButtons' : 'xboxButtons';
      const checks = Array.from(document.querySelectorAll(`#${buttonSection} input[type=checkbox]:checked`))
        .map(ch => ch.value);
      const extra = document.getElementById('controllerExtra').value.trim();
      problem = (checks.length ? checks.join('، ') : '') + 
                (extra ? (checks.length ? ' - ' : '') + extra : '');
      problem = `دسته ${consoleType === 'ps' ? 'پلی‌استیشن' : 'ایکس‌باکس'} - ${problem}`;
    } else {
      problem = document.getElementById('problemText').value.trim();
    }
    
    if (!name || !phone) {
      alert('لطفاً نام و شماره تماس را وارد کنید.');
      return;
    }
    
    if (!problem) {
      problem = deviceType.value === 'controller' ? '(توضیحی وارد نشده)' : '(نصب نرم‌افزار یا سایر خدمات)';
    }
    
    let receiptNumber = currentReceiptNumber;
    let isNewReceipt = false;
    
    const existingReceipt = findExistingReceipt(name, phone);
    if (!existingReceipt || !currentReceiptNumber) {
      receiptCounter++;
      receiptNumber = `R-${receiptCounter.toString().padStart(4, '0')}`;
      isNewReceipt = true;
      currentReceiptNumber = receiptNumber;
    }
    
    const historyItem = {
      receiptNumber: receiptNumber,
      name: name,
      phone: phone,
      device: device,
      problem: problem,
      deposit: deposit,
      deliveryDays: deliveryDays,
      deliveryDate: deliveryDate,
      date: new Date().toLocaleString('fa-IR'),
      timestamp: new Date().getTime(),
      invoice: shouldGenerateInvoice,
      invoiceAmount: invoiceAmount,
      software: selectedSoftware
    };
    
    const history = loadHistory();
    
    if (isNewReceipt) {
      history.push(historyItem);
    } else {
      const index = history.findIndex(item => item.receiptNumber === receiptNumber);
      if (index !== -1) {
        history[index] = historyItem;
      } else {
        history.push(historyItem);
      }
    }
    
    saveHistory(history);
    renderHistory();
    updateCustomerHistory();
    
    printReceipt(historyItem);
    currentEditingReceipt = historyItem;
    editReceiptBtn.style.display = 'block';
    deleteReceiptBtn.style.display = 'block';
  });
  
  function printReceipt(item) {
    let invoiceSection = '';
    let softwareSection = '';
    
    if (item.software && item.software.length > 0) {
      softwareSection = `
        <div class="software-list">
          <strong>نرم‌افزارهای مورد نیاز:</strong><br>
          ${item.software.join('، ')}
        </div>
      `;
    }
    
    if (item.invoice && item.invoiceAmount > 0) {
      invoiceSection = `
        <div class="invoice-total">
          مبلغ فاکتور: ${item.invoiceAmount.toLocaleString()} تومان
        </div>
      `;
    }
    
    let deviceDisplay = item.device;
    if (item.device === 'دسته کنسول' && item.problem.includes('پلی‌استیشن')) {
      deviceDisplay = 'دسته کنسول پلی‌استیشن';
    } else if (item.device === 'دسته کنسول' && item.problem.includes('ایکس‌باکس')) {
      deviceDisplay = 'دسته کنسول ایکس‌باکس';
    }
    
    printable.innerHTML = `
      <header>
        <img src="logo.png" alt="Logo">
        <div class="header-info">
          <div class="website">www.shahrelaptop.ir | @laptopcity.shop</div>
          <div class="phones">02333342004 | 09303342004</div>
        </div>
        <div class="header-title">فرم پذیرش</div>
      </header>
      
      <table>
        <tr><th>شماره پذیرش</th><td>${item.receiptNumber}</td></tr>
        <tr><th>تاریخ</th><td>${item.date}</td></tr>
        <tr><th>نام مشتری</th><td>${item.name}</td></tr>
        <tr><th>شماره تماس</th><td>${item.phone}</td></tr>
        <tr><th>نوع دستگاه</th><td>${deviceDisplay}</td></tr>
        <tr><th>توضیحات</th><td>${item.problem}</td></tr>
        <tr><th>بیعانه</th><td>${item.deposit === '0' ? 'ندارد' : item.deposit + ' تومان'}</td></tr>
        <tr><th>تاریخ تحویل</th><td>${item.deliveryDate} (${item.deliveryDays} روز کاری)</td></tr>
      </table>

      ${softwareSection}
      ${invoiceSection}

      <div class="notice">
        <div>هنگام تحویل کالا همراه داشتن فرم پذیرش الزامیست</div>
        <div>تاریخ تحویل تقریبی است و ممکن است تغییر کند</div>
      </div>

      <div class="signature">
        <div>جنس مذکور صحیح و سالم تحویل گردید</div>
        <div style="margin-top: 15px;">امضای مشتری: ________________</div>
      </div>
      
      <footer>
        <p>از اعتماد شما سپاسگزاریم</p>
      </footer>
    `;
    
    printable.style.display = 'block';
    window.print();
  }
  
  editReceiptBtn.addEventListener('click', function() {
    if (currentEditingReceipt) {
      document.getElementById('customerName').value = currentEditingReceipt.name;
      document.getElementById('customerPhone').value = currentEditingReceipt.phone;
      document.getElementById('deposit').value = currentEditingReceipt.deposit;
      document.getElementById('deliveryDays').value = currentEditingReceipt.deliveryDays;
      document.getElementById('problemText').value = currentEditingReceipt.problem.replace(/^دسته (پلی‌استیشن|ایکس‌باکس) - /, '');
      generateInvoice.checked = currentEditingReceipt.invoice;
      
      document.querySelectorAll('#softwareSection input[type="checkbox"]').forEach(checkbox => {
        if (!checkbox.id.includes('customService')) {
          checkbox.checked = currentEditingReceipt.software ? currentEditingReceipt.software.includes(checkbox.value) : false;
        }
      });
      
      if (currentEditingReceipt.device === 'دسته کنسول') {
        deviceType.value = 'controller';
        const isPS = currentEditingReceipt.problem.includes('پلی‌استیشن');
        document.querySelector('input[name="consoleType"][value="' + (isPS ? 'ps' : 'xbox') + '"]').checked = true;
        updateDeviceView();
      }
      
      currentReceiptNumber = currentEditingReceipt.receiptNumber;
      calculateInvoiceTotal();
      window.scrollTo(0, 0);
    }
  });
  
  deleteReceiptBtn.addEventListener('click', function() {
    if (currentEditingReceipt && confirm('آیا از حذف این پذیرش مطمئن هستید؟')) {
      const history = loadHistory();
      const updatedHistory = history.filter(item => item.receiptNumber !== currentEditingReceipt.receiptNumber);
      saveHistory(updatedHistory);
      renderHistory();
      updateCustomerHistory();
      
      document.getElementById('acceptForm').reset();
      document.getElementById('deliveryDays').value = '1';
      generateInvoice.checked = false;
      customService1Count.disabled = true;
      customService2Count.disabled = true;
      currentEditingReceipt = null;
      currentReceiptNumber = null;
      editReceiptBtn.style.display = 'none';
      deleteReceiptBtn.style.display = 'none';
      calculateInvoiceTotal();
      alert('پذیرش حذف شد.');
    }
  });
  
  window.loadReceiptForEdit = function(receiptNumber) {
    const history = loadHistory();
    const item = history.find(h => h.receiptNumber === receiptNumber);
    if (item) {
      currentEditingReceipt = item;
      editReceiptBtn.click();
    }
  };
  
  window.deleteReceipt = function(receiptNumber) {
    if (confirm('آیا از حذف این پذیرش مطمئن هستید؟')) {
      const history = loadHistory();
      const updatedHistory = history.filter(item => item.receiptNumber !== receiptNumber);
      saveHistory(updatedHistory);
      renderHistory();
      updateCustomerHistory();
      
      if (currentEditingReceipt && currentEditingReceipt.receiptNumber === receiptNumber) {
        document.getElementById('acceptForm').reset();
        document.getElementById('deliveryDays').value = '1';
        generateInvoice.checked = false;
        customService1Count.disabled = true;
        customService2Count.disabled = true;
        currentEditingReceipt = null;
        currentReceiptNumber = null;
        editReceiptBtn.style.display = 'none';
        deleteReceiptBtn.style.display = 'none';
        calculateInvoiceTotal();
      }
      alert('پذیرش حذف شد.');
    }
  };
  
  // مقداردهی اولیه
  updateDeviceView();
  updateCustomerHistory();
  renderHistory();
});
</script>
